version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cloud-drop-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloud_drop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: cloud-drop-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/cloud_drop"
    depends_on:
      - postgres

volumes:
  postgres_data:
services:
  backend:
    image: ${BACKEND_IMAGE:-clouddrop-backend:latest}
    container_name: clouddrop-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 5000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - clouddrop_default

  nginx:
    image: nginx:alpine
    container_name: clouddrop-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - clouddrop_default

networks:
  clouddrop_default:
    external: true
