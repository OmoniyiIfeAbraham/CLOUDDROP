services:
  backend:
    image: ${BACKEND_IMAGE:-clouddrop-backend:latest}
    container_name: clouddrop-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 5000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - clouddrop_default

networks:
  clouddrop_default:
    external: true
