name: CloudDrop Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        default: "latest"
      frontend_image_tag:
        description: "Frontend Docker image tag to deploy"
        required: true
        default: "latest"

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SSM_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Deploy to EC2 through SSM
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          FRONTEND_IMAGE_TAG: ${{ inputs.frontend_image_tag }}
          INSTANCE_ID: i-057c4c651255b57e7
          AWS_REGION: eu-west-1
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CloudDrop deployment from GitHub Actions" \
            --parameters "$(jq -n \
              --arg tag "$IMAGE_TAG" \
              --arg frontend_tag "$FRONTEND_IMAGE_TAG" \
              '{commands: [
                "set -e",
                "cd /opt/clouddrop",
                ("export BACKEND_IMAGE=ghcr.io/omoniyiifeabraham/clouddrop-backend:" + $tag),
                ("export FRONTEND_IMAGE=ghcr.io/omoniyiifeabraham/clouddrop-frontend:" + $frontend_tag),
                "./scripts/deploy.sh",
                "./scripts/verify-deployment.sh"
              ]}')" \
            --query 'Command.CommandId' \
            --output text \
            --region "$AWS_REGION")

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text \
              --region "$AWS_REGION" 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "CloudDrop deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --output json || true
                echo "CloudDrop deployment failed."
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM deployment result."
          exit 1
