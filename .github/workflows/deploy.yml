name: CloudDrop Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Backend Docker image tag to deploy"
        required: true
        default: "latest"
      frontend_image_tag:
        description: "Frontend Docker image tag to deploy"
        required: true
        default: "latest"
  workflow_run:
    workflows:
      - Backend CI
      - Frontend CI and Image Build
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

# A shared Actions concurrency group can discard a pending frontend release
# when a backend release enters the queue. Serialize on EC2 with flock instead.
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Select the component and image tags
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number || 0 }}
          INPUT_BACKEND_TAG: ${{ inputs.image_tag }}
          INPUT_FRONTEND_TAG: ${{ inputs.frontend_image_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            component=all
            backend_tag="$INPUT_BACKEND_TAG"
            frontend_tag="$INPUT_FRONTEND_TAG"
          else
            backend_tag=""
            frontend_tag=""
            case "$WORKFLOW_NAME" in
              "Backend CI")
                component=backend
                backend_tag="$RELEASE_SHA"
                ;;
              "Frontend CI and Image Build")
                component=frontend
                frontend_tag="$RELEASE_SHA"
                ;;
              *) echo "Unexpected build workflow" >&2; exit 1 ;;
            esac
          fi
          for tag in "$backend_tag" "$frontend_tag"; do
            if [ -n "$tag" ] && [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Invalid image tag" >&2
              exit 1
            fi
          done
          {
            echo "component=$component"
            echo "backend_tag=$backend_tag"
            echo "frontend_tag=$frontend_tag"
            echo "run_number=$RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SSM_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Deploy the successful component through SSM
        env:
          COMPONENT: ${{ steps.release.outputs.component }}
          BACKEND_TAG: ${{ steps.release.outputs.backend_tag }}
          FRONTEND_TAG: ${{ steps.release.outputs.frontend_tag }}
          RUN_NUMBER: ${{ steps.release.outputs.run_number }}
          INSTANCE_ID: i-057c4c651255b57e7
          AWS_REGION: eu-west-1
        run: |
          set -euo pipefail

          # Send non-secret runtime files from the same commit as the image.
          # The host .env, credentials and certificates are never in this bundle.
          tar -czf "$RUNNER_TEMP/clouddrop-runtime.tar.gz" \
            docker-compose.prod.yml nginx/default.conf \
            scripts/deploy-release.sh scripts/deploy.sh \
            scripts/verify-deployment.sh scripts/rollback.sh
          bundle=$(base64 -w 0 "$RUNNER_TEMP/clouddrop-runtime.tar.gz")
          jq -n --arg bundle "$bundle" --arg component "$COMPONENT" \
            --arg backend "$BACKEND_TAG" --arg frontend "$FRONTEND_TAG" \
            --arg run_number "$RUN_NUMBER" \
            '{commands: [
              "set -eu",
              "cd /opt/clouddrop",
              "release_dir=$(mktemp -d /opt/clouddrop/.release-XXXXXXXX)",
              ("printf %s " + ($bundle | @sh) + " | base64 --decode | tar -xz -C \"$release_dir\""),
              ("bash \"$release_dir/scripts/deploy-release.sh\" " +
                ([$component, $backend, $frontend, $run_number] | map(@sh) | join(" ")))
            ], executionTimeout: ["1800"]}' > "$RUNNER_TEMP/ssm-parameters.json"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CloudDrop $COMPONENT deployment" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query Command.CommandId --output text --region "$AWS_REGION")

          for attempt in $(seq 1 360); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text --region "$AWS_REGION" 2>/dev/null || true)
            echo "Deployment status: ${STATUS:-Pending}"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent --output text --region "$AWS_REGION"
                echo "### $COMPONENT release completed" >> "$GITHUB_STEP_SUMMARY"
                echo "Backend tag: ${BACKEND_TAG:-unchanged}" >> "$GITHUB_STEP_SUMMARY"
                echo "Frontend tag: ${FRONTEND_TAG:-unchanged}" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" --output json || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM. Inspect the remote command before retrying." >&2
          exit 1
