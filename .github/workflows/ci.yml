name: Backend CI

on:
  push:
    branches:
      - main
      - feature/devops-cicd
    paths:
      - "backend/**"
      - "scripts/**"
      - "nginx/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      JWT_SECRET: ci-test-jwt-secret

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test deployment scripts
        working-directory: .
        run: node --test scripts/tests/deployment.test.mjs

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build backend
        run: npm run build

      - name: Run tests
        run: npm test -- --run

      - name: Build Docker image
        working-directory: .
        run: docker build -t clouddrop-backend:ci ./backend

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Push SHA-tagged backend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/omoniyiifeabraham/clouddrop-backend:${{ github.sha }}

      - name: Push latest backend image from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/omoniyiifeabraham/clouddrop-backend:latest
