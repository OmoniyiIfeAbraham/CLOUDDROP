server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts a content hash in every asset name, so an asset never changes.
    # A missing one must 404: falling back to index.html would hand the browser
    # HTML for a script and blank the page after a redeploy.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Revalidate the app shell so a redeploy is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
